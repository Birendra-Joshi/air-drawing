<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hand Magic Canvas ✨</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #050505;

    color: white;

    font-family: Arial, sans-serif;
}

.container {
    width: 95%;
    max-width: 1100px;

    margin: 25px auto;
}


/* =========================================
   HEADER
========================================= */

header {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 18px;
}

h1 {
    margin: 0;

    font-size:
        clamp(28px, 5vw, 50px);
}

p {
    color: #888;

    margin-top: 7px;
}


/* =========================================
   STAGE
========================================= */

.stage {

    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: black;

    overflow: hidden;

    border-radius: 20px;

    border: 1px solid #333;
}


/* =========================================
   CAMERA

   Mirror camera like a selfie camera
========================================= */

#video {

    position: absolute;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    object-fit: cover;

    transform: scaleX(-1);

    z-index: 1;
}


/* =========================================
   DRAWING CANVAS
========================================= */

#canvas,
#cursor {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;
}


#canvas {
    z-index: 2;
}


#cursor {

    z-index: 3;

    pointer-events: none;
}


/* =========================================
   STATUS
========================================= */

.status {

    position: absolute;

    top: 15px;
    left: 15px;

    z-index: 10;

    padding: 10px 15px;

    background:
        rgba(0,0,0,.75);

    border-radius: 20px;

    font-size: 14px;
}


/* =========================================
   COLOR INDICATOR
========================================= */

.color {

    position: absolute;

    top: 18px;
    right: 18px;

    width: 22px;
    height: 22px;

    border-radius: 50%;

    z-index: 10;

    box-shadow:
        0 0 10px currentColor,
        0 0 25px currentColor;
}


/* =========================================
   CONTROLS
========================================= */

.controls {

    margin-top: 15px;

    display: flex;

    gap: 10px;
}


button {

    padding: 10px 18px;

    border:
        1px solid #444;

    background: #151515;

    color: white;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;
}


button:hover {

    background: #252525;
}


/* =========================================
   INSTRUCTIONS
========================================= */

.instructions {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    margin-top: 15px;
}


.card {

    padding: 15px;

    background: #111;

    border:
        1px solid #252525;

    border-radius: 14px;
}


.card span {

    font-size: 25px;
}


.card b {

    display: block;

    margin-top: 5px;
}


.card small {

    color: #888;
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:700px) {

    header {

        flex-direction: column;

        align-items: flex-start;

        gap: 15px;
    }


    .instructions {

        grid-template-columns: 1fr;
    }


    .stage {

        aspect-ratio: 4 / 5;
    }

}

</style>

</head>


<body>


<div class="container">


<header>

<div>

<h1>
✨ Hand Magic
</h1>

<p>
Draw in the air with your hand
</p>

</div>

</header>



<div class="stage">


<!-- =====================================
     CAMERA
====================================== -->

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>



<!-- =====================================
     DRAWING
====================================== -->

<canvas id="canvas"></canvas>


<!-- =====================================
     HAND CURSOR
====================================== -->

<canvas id="cursor"></canvas>



<!-- =====================================
     STATUS
====================================== -->

<div
    id="status"
    class="status">

Loading...

</div>



<!-- =====================================
     COLOR
====================================== -->

<div
    id="color"
    class="color">

</div>


</div>



<!-- =====================================
     BUTTONS
====================================== -->

<div class="controls">

<button id="clear">
Clear
</button>


<button id="download">
Download
</button>

</div>



<!-- =====================================
     HELP
====================================== -->

<div class="instructions">


<div class="card">

<span>
☝️
</span>

<b>
Index Finger
</b>

<small>
Move your finger to draw
</small>

</div>



<div class="card">

<span>
🖐️
</span>

<b>
Open Palm
</b>

<small>
Clear the drawing
</small>

</div>



<div class="card">

<span>
🤏
</span>

<b>
Pinch
</b>

<small>
Change color
</small>

</div>


</div>


</div>



<script type="module">


/* =====================================================
   MEDIAPIPE
===================================================== */

import {

    HandLandmarker,

    FilesetResolver

}

from

"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/vision_bundle.mjs";



/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById(
        "video"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const cursor =
    document.getElementById(
        "cursor"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const cursorCtx =
    cursor.getContext(
        "2d"
    );


const status =
    document.getElementById(
        "status"
    );


const colorElement =
    document.getElementById(
        "color"
    );


const clearButton =
    document.getElementById(
        "clear"
    );


const downloadButton =
    document.getElementById(
        "download"
    );



/* =====================================================
   VARIABLES
===================================================== */

let detector = null;

let lastVideoTime = -1;

let lastPoint = null;

let wasPinching = false;

let lastClearTime = 0;



/* =====================================================
   COLORS
===================================================== */

const colors = [

    "#ff00ff",

    "#00ffff",

    "#00ff66",

    "#ffff00",

    "#ff6600",

    "#ffffff"

];


let colorIndex = 0;


let currentColor =
    colors[colorIndex];



function updateColor() {

    colorElement.style.background =
        currentColor;

    colorElement.style.color =
        currentColor;

}


updateColor();



/* =====================================================
   CANVAS RESIZE
===================================================== */

function resizeCanvas() {

    const width =
        video.clientWidth;

    const height =
        video.clientHeight;


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    cursor.width =
        width * dpr;

    cursor.height =
        height * dpr;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    cursor.style.width =
        width + "px";

    cursor.style.height =
        height + "px";


    ctx.setTransform(

        dpr,
        0,
        0,
        dpr,
        0,
        0

    );


    cursorCtx.setTransform(

        dpr,
        0,
        0,
        dpr,
        0,
        0

    );

}


window.addEventListener(

    "resize",

    resizeCanvas

);



/* =====================================================
   CLEAR FUNCTION
===================================================== */

function clearDrawing() {

    ctx.clearRect(

        0,
        0,

        canvas.clientWidth,
        canvas.clientHeight

    );


    lastPoint = null;

}



/* =====================================================
   CLEAR BUTTON
===================================================== */

clearButton.onclick =
    clearDrawing;



/* =====================================================
   DOWNLOAD
===================================================== */

downloadButton.onclick = () => {

    const link =
        document.createElement(
            "a"
        );


    link.download =
        "hand-magic-art.png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();

};



/* =====================================================
   DISTANCE
===================================================== */

function distance(a, b) {

    return Math.sqrt(

        Math.pow(
            a.x - b.x,
            2
        )

        +

        Math.pow(
            a.y - b.y,
            2
        )

    );

}



/* =====================================================
   FINGER DETECTION
===================================================== */

function indexUp(hand) {

    return (

        hand[8].y <
        hand[6].y

    );

}


function middleUp(hand) {

    return (

        hand[12].y <
        hand[10].y

    );

}


function ringUp(hand) {

    return (

        hand[16].y <
        hand[14].y

    );

}


function pinkyUp(hand) {

    return (

        hand[20].y <
        hand[18].y

    );

}



/* =====================================================
   OPEN PALM
===================================================== */

function isOpenPalm(hand) {

    return (

        indexUp(hand) &&

        middleUp(hand) &&

        ringUp(hand) &&

        pinkyUp(hand)

    );

}



/* =====================================================
   PINCH
===================================================== */

function isPinching(hand) {

    const thumb =
        hand[4];

    const index =
        hand[8];


    const d =
        distance(
            thumb,
            index
        );


    return d < 0.065;

}



/* =====================================================
   DRAW LINE

   IMPORTANT:

   Camera is mirrored.

   Therefore X coordinate
   is also mirrored.
===================================================== */

function drawLine(
    from,
    to
) {


    const x1 =

        (1 - from.x)
        *
        canvas.clientWidth;


    const y1 =

        from.y
        *
        canvas.clientHeight;


    const x2 =

        (1 - to.x)
        *
        canvas.clientWidth;


    const y2 =

        to.y
        *
        canvas.clientHeight;



    ctx.save();



    /* =====================================
       NEON OUTER GLOW
    ====================================== */

    ctx.strokeStyle =
        currentColor;


    ctx.shadowColor =
        currentColor;


    ctx.shadowBlur =
        28;


    ctx.lineWidth =
        10;


    ctx.lineCap =
        "round";


    ctx.lineJoin =
        "round";



    ctx.beginPath();


    ctx.moveTo(
        x1,
        y1
    );


    ctx.lineTo(
        x2,
        y2
    );


    ctx.stroke();



    /* =====================================
       WHITE CORE
    ====================================== */

    ctx.shadowBlur =
        5;


    ctx.strokeStyle =
        "#ffffff";


    ctx.lineWidth =
        2;



    ctx.beginPath();


    ctx.moveTo(
        x1,
        y1
    );


    ctx.lineTo(
        x2,
        y2
    );


    ctx.stroke();



    ctx.restore();

}



/* =====================================================
   HAND CURSOR

   Also mirror X coordinate.
===================================================== */

function showCursor(hand) {

    cursorCtx.clearRect(

        0,
        0,

        cursor.clientWidth,
        cursor.clientHeight

    );


    const point =
        hand[8];


    const x =

        (1 - point.x)
        *
        cursor.clientWidth;


    const y =

        point.y
        *
        cursor.clientHeight;



    cursorCtx.save();



    cursorCtx.beginPath();


    cursorCtx.arc(

        x,
        y,

        11,

        0,
        Math.PI * 2

    );



    cursorCtx.strokeStyle =
        currentColor;


    cursorCtx.lineWidth =
        3;


    cursorCtx.shadowColor =
        currentColor;


    cursorCtx.shadowBlur =
        20;



    cursorCtx.stroke();


    cursorCtx.restore();

}



/* =====================================================
   SETUP MEDIAPIPE
===================================================== */

async function setupHandTracking() {

    status.innerText =
        "Loading AI hand tracking...";


    const vision =

        await FilesetResolver
        .forVisionTasks(

            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm"

        );



    detector =

        await HandLandmarker
        .createFromOptions(

            vision,

            {


                baseOptions: {


                    modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",


                    delegate:
                        "GPU"

                },


                runningMode:
                    "VIDEO",


                numHands:
                    1,


                minHandDetectionConfidence:
                    0.3,


                minHandPresenceConfidence:
                    0.3,


                minTrackingConfidence:
                    0.3

            }

        );


    status.innerText =
        "AI Ready ✨";

}



/* =====================================================
   CAMERA
===================================================== */

async function startCamera() {


    const stream =

        await navigator
        .mediaDevices
        .getUserMedia({

            video: {

                width: {
                    ideal: 1280
                },

                height: {
                    ideal: 720
                },

                facingMode:
                    "user"

            },


            audio: false

        });



    video.srcObject =
        stream;



    await video.play();


    resizeCanvas();

}



/* =====================================================
   MAIN DETECTION LOOP
===================================================== */

function loop() {


    if (

        !detector ||

        video.readyState < 2

    ) {

        requestAnimationFrame(
            loop
        );

        return;

    }



    if (

        video.currentTime !==
        lastVideoTime

    ) {


        lastVideoTime =
            video.currentTime;



        const result =

            detector.detectForVideo(

                video,

                performance.now()

            );



        /* =====================================
           HAND FOUND
        ====================================== */

        if (

            result.landmarks &&

            result.landmarks.length > 0

        ) {


            const hand =
                result.landmarks[0];



            /* =================================
               SHOW CURSOR
            ================================= */

            showCursor(hand);



            /* =================================
               DETECT GESTURES
            ================================= */

            const palm =
                isOpenPalm(hand);


            const pinch =
                isPinching(hand);



            /* =================================
               OPEN PALM
            ================================= */

            if (palm) {


                status.innerText =
                    "🖐️ OPEN PALM → CLEAR";


                if (

                    performance.now()
                    -
                    lastClearTime
                    >
                    800

                ) {


                    clearDrawing();


                    lastClearTime =
                        performance.now();

                }


                lastPoint =
                    null;


            }



            /* =================================
               PINCH
            ================================= */

            else if (pinch) {


                status.innerText =
                    "🤏 PINCH → CHANGE COLOR";


                /*
                Change color only
                when pinch starts.
                */

                if (!wasPinching) {


                    colorIndex =

                        (
                            colorIndex + 1
                        )

                        %

                        colors.length;


                    currentColor =
                        colors[colorIndex];


                    updateColor();

                }


                wasPinching =
                    true;


                lastPoint =
                    null;

            }



            /* =================================
               DRAW
            ================================= */

            else {


                wasPinching =
                    false;


                status.innerText =
                    "☝️ DRAWING";


                const point = {


                    x:
                        hand[8].x,


                    y:
                        hand[8].y

                };



                if (lastPoint) {


                    drawLine(

                        lastPoint,

                        point

                    );

                }


                lastPoint =
                    point;

            }

        }



        /* =====================================
           NO HAND
        ====================================== */

        else {


            lastPoint =
                null;


            wasPinching =
                false;


            cursorCtx.clearRect(

                0,
                0,

                cursor.clientWidth,
                cursor.clientHeight

            );


            status.innerText =
                "Show your hand 👋";

        }

    }



    requestAnimationFrame(
        loop
    );

}



/* =====================================================
   START APP
===================================================== */

async function startApp() {


    try {


        await setupHandTracking();


        await startCamera();


        loop();


    }


    catch(error) {


        console.error(
            error
        );


        status.innerText =
            "❌ Camera permission required";

    }

}


startApp();

</script>

</body>
</html>
