<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Magic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <div>
                <div class="tag">HAND TRACKING LAB</div>
                <h1>HAND MAGIC</h1>
                <p>Draw in the air using your hand.</p>
            </div>

            <div class="live-badge">
                <span></span>
                LIVE
            </div>
        </header>

        <section class="stage">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
            <canvas id="cursor"></canvas>

            <div id="status" class="status">
                Loading...
            </div>

            <div id="color" class="color"></div>
        </section>

        <div class="controls">
            <button id="clear">CLEAR</button>
            <button id="download">DOWNLOAD</button>
        </div>

        <section class="instructions">
            <div class="card">
                <span>01</span>
                <h2>INDEX</h2>
                <p>Point with your index finger to draw.</p>
            </div>

            <div class="card">
                <span>02</span>
                <h2>PALM</h2>
                <p>Show your open palm to clear everything.</p>
            </div>

            <div class="card">
                <span>03</span>
                <h2>PINCH</h2>
                <p>Pinch your fingers together to change color.</p>
            </div>
        </section>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
